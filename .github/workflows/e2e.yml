name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
          check-latest: true
      - name: Verify Go
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.25.0"
      - name: Install Linux networking tools
        run: sudo apt-get update && sudo apt-get install -y iproute2
      - name: Build
        run: go build -o defenux .
      - name: E2E
        run: go test -v ./e2e
