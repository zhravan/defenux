name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install Linux networking tools
        run: sudo apt-get update && sudo apt-get install -y iproute2
      - name: Build
        run: go build -o defenux .
      - name: E2E
        run: sudo -E go test -v ./e2e
