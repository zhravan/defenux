name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
          check-latest: true

      - name: Verify Go
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.25.0"

      - name: Install Linux networking tools
        run: sudo apt-get update && sudo apt-get install -y iproute2

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -buildvcs=false -o defenux .

      - name: E2E
        run: go test -v ./e2e

      - name: Package
        run: tar -czf defenux_linux_amd64.tar.gz defenux

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: defenux-linux-amd64
          path: defenux_linux_amd64.tar.gz
