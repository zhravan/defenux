name: release on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Calculate release version
        id: version
        run: |
          set -eu

          latest="$(git tag --sort=-version:refname | head -n 1)"
          version="$(tr -d '[:space:]' < cmd/version.txt)"
          tag="v$version"

          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          latest_version="${latest#v}"

          IFS=. read -r major minor patch <<EOF
          $latest_version
          EOF

          expected="v${major}.${minor}.$((patch + 1))"
          test "$tag" = "$expected"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build test binary
        run: go build -o defenux .

      - name: Test
        run: go test ./...

      - name: Tag merge commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ steps.version.outputs.ref }}
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi

          git tag "$TAG" "$MERGE_SHA"
          git push origin "$TAG"

  publish:
    needs: release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      ref: ${{ needs.release.outputs.ref }}
      skip_tests: true
      verify_version: true
    permissions:
      contents: write
